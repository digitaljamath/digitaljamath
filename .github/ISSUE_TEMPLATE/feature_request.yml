name: Feature request
description: Propose a concrete improvement for jamath committees or members.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer one job per request. See [docs/FEATURES.md](https://github.com/digitaljamath/digitaljamath/blob/dev/docs/FEATURES.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked today, and what do they need?
      placeholder: Treasurers cannot export Form 10BD for only one Fund Type...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete behaviour, not a vague platform idea.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Likely surface
      options:
        - Frappe DocTypes / Python
        - Committee console (/jamath)
        - Member portal
        - Marketing (Astro)
        - Docs / i18n
        - Unsure
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What this should not include.
      placeholder: Not a full HRMS rewrite...
